# DBY-W09 touchscreen -> logical screen mapping for matepad-touch-rightclick.
# Logical landscape size at Mutter's 2x scale. Dimensions swap when the
# device rotates into portrait; the orientation comes from matepad-volkeys.
SCREEN_WIDTH=1280
SCREEN_HEIGHT=800
ROTATION=270
# /sys/touchscreen/rotation: 0=normal, 1=left-up, 2=bottom-up, 3=right-up.
ROTATION_FILE=/sys/touchscreen/rotation
TAP_MS=350
LONG_PRESS_MS=550
SCROLL_STEP=40
MOVE_THRESHOLD=600
# TOUCH_NAME=input_mt_wrapper
